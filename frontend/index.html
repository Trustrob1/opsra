<!doctype html>
<html lang="en">
  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Opsra" />
  <meta name="apple-touch-icon" href="/icons/icon-192.png" />

  <!-- iOS splash screens — prevents white flash on launch -->
  <link rel="apple-touch-startup-image" href="/apple-touch-icon.png" />

  <title>Opsra</title>

  <!-- STOREFRONT-2: on a catalog link, ask for the catalog now, while the app is still downloading. -->
  <script>
    (function () {
      try {
        var m = location.pathname.match(/^\/(?:catalog|shop)\/([^\/?#]+)/)
        if (!m || !window.fetch) return
        var base = '%VITE_API_URL%'
        if (base.charAt(0) === '%') base = 'http://localhost:8000'
        var p = fetch(base + '/api/v1/public/catalog/' + m[1]).then(function (r) {
          if (!r.ok) { var e = new Error('Catalog API error: ' + r.status); e.status = r.status; throw e }
          return r.json()
        })
        p.catch(function () {})
        window.__opsraCatalog = { slug: m[1], promise: p }
      } catch (e) { /* the app loads the catalog itself */ }
    })()
  </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
